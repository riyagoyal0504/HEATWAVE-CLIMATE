<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatwave Climate Intelligence</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--ink:#2b1d16;--mut:#7a6558;--acc:#d9480f;--line:#f0dccb;--watch:#f59f00;--warning:#e8590c;--severe:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#1d1512;--card:#2a1e19;--ink:#f6e9df;--mut:#b39c8d;--line:#43312a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
h1{font-size:18px;margin:0;color:var(--acc)}main{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;overflow-x:auto}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
button.tab{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.tab.on{background:var(--acc);color:#fff}
input,select,textarea{padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);margin:2px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut)}
.pill{padding:2px 8px;border-radius:99px;color:#fff;font-size:12px}.Watch{background:var(--watch)}.Warning{background:var(--warning)}.Severe{background:var(--severe)}
.mut{color:var(--mut);font-size:13px}.msg{margin:6px 0;font-size:14px}
</style>
</head>
<body>
<header><h1>🔥 Heatwave Climate Intelligence</h1><div id="who"></div></header>
<main>
  <div id="login" class="card" style="display:none">
    <b>Login</b> <span class="mut">(or continue as public below)</span><br>
    <input id="u" placeholder="username"><input id="p" type="password" placeholder="password">
    <button onclick="login()">Login</button>
    <div class="mut">Demo: admin/admin123 · analyst/analyst123 · public/public123</div><div id="err" class="msg" style="color:var(--severe)"></div>
  </div>
  <nav id="tabs"></nav>
  <div id="view"></div>
</main>
<script>
let me={role:'public'}, tab='Advisories', dsel='';
const $=id=>document.getElementById(id);
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}
const post=(u,b,m='POST')=>api(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function table(rows){if(!rows.length)return '<p class="mut">No data.</p>';const k=Object.keys(rows[0]);
 return '<table><tr>'+k.map(x=>`<th>${x.replace(/_/g,' ')}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+k.map(c=>
  `<td>${c==='level'?`<span class="pill ${r[c]}">${r[c]}</span>`:r[c]}</td>`).join('')+'</tr>').join('')+'</table>'}
async function init(){me=await api('/api/me');render()}
function render(){
 $('who').innerHTML=me.user?`${me.user} (${me.role}) <button onclick="logout()">Logout</button>`:`Public view <button onclick="$('login').style.display='block'">Login</button>`;
 if(me.user)$('login').style.display='none';
 const tabs=['Advisories'];if(['analyst','admin'].includes(me.role))tabs.push('Monitoring','Hotspots','Forecast Accuracy','Analysis');if(me.role==='admin')tabs.push('Admin');
 if(!tabs.includes(tab))tab='Advisories';
 $('tabs').innerHTML=tabs.map(t=>`<button class="tab ${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('');load()}
async function load(){const v=$('view');v.innerHTML='<div class="card">Loading…</div>';
 try{
  if(tab==='Advisories'){const ds=await api('/api/districts');
   v.innerHTML='<div class="card"><b>Latest heat advisories</b> <span class="mut">(auto-generated by DB trigger)</span><br><select onchange="dsel=this.value;load()"><option value="">All districts</option>'+ds.map(x=>`<option ${x===dsel?'selected':''}>${x}</option>`).join('')+'</select>'+table(await api('/api/advisories?district='+encodeURIComponent(dsel)))+'</div>'}
  else if(tab==='Monitoring')v.innerHTML='<div class="card"><b>District summary</b> <span class="mut">(view + JOIN + GROUP BY)</span>'+table(await api('/api/summary'))+'</div><div class="card"><b>Latest readings</b>'+table(await api('/api/readings'))+'</div>';
  else if(tab==='Hotspots')v.innerHTML='<div class="card"><b>Heatwave hotspots</b> <span class="mut">(nested query: ≥3 alerts and above-average peak)</span>'+table(await api('/api/hotspots'))+'</div>';
  else if(tab==='Forecast Accuracy')v.innerHTML='<div class="card"><b>AI forecast vs observed</b> <span class="mut">(mean absolute error, °C)</span>'+table(await api('/api/forecast-accuracy'))+'</div>';
  else if(tab==='Analysis')await analysis();
  else if(tab==='Admin')admin();
 }catch(e){v.innerHTML=`<div class="card" style="color:var(--severe)">${e.message}</div>`}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function analysis(){
 const ds=await api('/api/districts'),rows=await api('/api/analysis');
 $('view').innerHTML=`<div class="card"><b>New analysis report</b> <span class="mut">(average, peak and alert days are calculated from the database for the period you choose)</span><br>
  <select id="ad">${ds.map(x=>`<option>${x}</option>`).join('')}</select>
  <input id="as" type="date" title="From"><input id="ae" type="date" title="To">
  <select id="ar"><option>Low</option><option>Moderate</option><option>High</option><option>Extreme</option></select><br>
  <input id="at" placeholder="Title" style="width:90%"><br>
  <textarea id="af" rows="3" placeholder="Findings / recommendations" style="width:90%"></textarea><br>
  <button onclick="saveA()">Save report</button><div id="am" class="msg"></div></div>
  <div class="card"><b>Saved reports</b> <button onclick="location.href='/api/analysis/export'">Export CSV</button>`+
  table(rows.map(r=>({id:r.report_id,district:r.district,period:r.period_start+' to '+r.period_end,title:esc(r.title),risk:r.risk_level,
   avg_max_temp:r.avg_max_temp,peak_temp:r.peak_temp,alert_days:r.alert_days,findings:esc(r.findings),analyst:esc(r.analyst),
   action:`<button onclick="delA(${r.report_id})">Delete</button>`})))+'</div>'}
async function saveA(){try{await post('/api/analysis',{district:$('ad').value,period_start:$('as').value,period_end:$('ae').value,
  title:$('at').value,risk_level:$('ar').value,findings:$('af').value});await analysis();$('am').textContent='Report saved.'}catch(e){$('am').textContent=e.message}}
async function delA(id){if(!confirm('Delete this report?'))return;try{await api('/api/analysis/'+id,{method:'DELETE'});await analysis()}catch(e){alert(e.message)}}
async function admin(){
 const st=await api('/api/stations'),th=await api('/api/thresholds');
 $('view').innerHTML=`<div class="card"><b>Ingest reading</b> <span class="mut">(runs in a transaction; trigger raises alert if threshold breached)</span><br>
  <select id="st">${st.map(s=>`<option value="${s.station_id}">${s.name} – ${s.district}</option>`).join('')}</select>
  <input id="t" type="number" step="0.1" placeholder="Max temp °C"><input id="h" type="number" placeholder="Humidity % (optional)"><input id="w" type="number" placeholder="Wind km/h (optional)">
  <button onclick="addR()">Submit</button><div id="rm" class="msg"></div></div>
  <div class="card"><b>Risk thresholds (°C)</b><br>${th.map(t=>`<span class="pill ${t.level}">${t.level}</span> <input id="th${t.threshold_id}" type="number" value="${t.min_temp}" style="width:80px"> <button onclick="updT(${t.threshold_id})">Save</button><br>`).join('')}<div id="tm" class="msg"></div></div>`}
async function addR(){try{const r=await post('/api/readings',{station_id:+$('st').value,temperature:+$('t').value,humidity:$('h').value===''?null:+$('h').value,wind_speed:$('w').value===''?null:+$('w').value});
 $('rm').textContent=r.alert_generated?'Saved. ⚠ Alert generated by trigger.':'Saved. No threshold breached.'}catch(e){$('rm').textContent=e.message}}
async function updT(id){try{await post('/api/thresholds/'+id,{min_temp:+$('th'+id).value},'PUT');$('tm').textContent='Threshold updated.'}catch(e){$('tm').textContent=e.message}}
async function login(){try{me=await post('/api/login',{username:$('u').value,password:$('p').value});$('err').textContent='';render()}catch(e){$('err').textContent=e.message}}
async function logout(){await post('/api/logout',{});me={role:'public'};tab='Advisories';render()}
init();
</script>
</body>
</html>
